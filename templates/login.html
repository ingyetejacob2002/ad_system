<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AdSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0b0f19, #111827);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e5e7eb;
}

/* LOGIN CARD */
.login-card {
    width: 100%;
    max-width: 420px;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    animation: fadeUp 0.8s ease-out;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* INPUTS */
.form-control {
    background: #0b0f19;
    border: 1px solid #374151;
    color: #e5e7eb;
}

.form-control:focus {
    border-color: #4f46e5;
    box-shadow: none;
    background: #0b0f19;
    color: #fff;
}

/* BUTTON */
.btn-primary {
    background: #4f46e5;
    border: none;
}

.btn-primary:hover {
    background: #4338ca;
}

/* FOOTER TEXT */
.small-text {
    text-align: center;
    margin-top: 15px;
    color: #9ca3af;
}
</style>
</head>

<body>

<div class="login-card">

    <h2>Welcome Back 👋</h2>
    <p class="text-center text-secondary mb-4">Login to your AdSphere account</p>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" type="text" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">
            Login
        </button>

    </form>

    <div class="small-text">
        Don’t have an account? <a href="/register" class="text-decoration-none text-primary">Sign up</a>
    </div>

</div>

</body>
</html>
