<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Pending Ads</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b0f19;
    color: #e5e7eb;
}

/* HEADER */
.header {
    padding: 30px 0;
    text-align: center;
}

/* CARD */
.ad-card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 20px;
    transition: 0.3s;
}

.ad-card:hover {
    transform: translateY(-5px);
    border-color: #4f46e5;
}

/* IMAGE */
.ad-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
}

/* BADGE */
.badge-pending {
    background: #f59e0b;
    color: #111;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 20px;
}

/* BUTTONS */
.btn-approve {
    background: #22c55e;
    border: none;
}

.btn-approve:hover {
    background: #16a34a;
}

.btn-reject {
    background: #ef4444;
    border: none;
}

.btn-reject:hover {
    background: #dc2626;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

@media (min-width: 768px) {
    .grid {
        grid-template-columns: 1fr 1fr 1fr;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h2>Admin Dashboard 🛠️</h2>
    <p class="text-secondary">Manage and approve pending advertisements</p>
</div>

<div class="container">

    {% if ads %}
    <div class="grid">

        {% for ad in ads %}
        <div class="ad-card">

            <img src="{{ url_for('static', filename='uploads/' + ad.image) }}"
                 class="ad-img mb-3">

            <h5>{{ ad.title }}</h5>

            <p class="text-secondary small">
                Status: <span class="badge-pending">Pending</span>
            </p>

            <div class="d-flex gap-2 mt-3">

                <a href="/approve/{{ ad.id }}" class="btn btn-approve btn-sm w-50">
                    Approve
                </a>

                <a href="/reject/{{ ad.id }}" class="btn btn-reject btn-sm w-50">
                    Reject
                </a>

            </div>

        </div>
        {% endfor %}

    </div>

    {% else %}
        <div class="text-center text-secondary mt-5">
            No pending ads 🚀
        </div>
    {% endif %}

</div>

</body>
</html>
