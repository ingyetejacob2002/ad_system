<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Ad - AdSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b0f19;
    color: #e5e7eb;
}

/* PAGE WRAPPER */
.wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 15px;
}

/* CARD */
.ad-card {
    width: 100%;
    max-width: 700px;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 18px;
    padding: 35px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    animation: fadeUp 0.8s ease-out;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* HEADER */
h2 {
    text-align: center;
    margin-bottom: 5px;
}

.subtext {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 25px;
}

/* INPUTS */
.form-control {
    background: #0b0f19;
    border: 1px solid #374151;
    color: #e5e7eb;
}

.form-control:focus {
    border-color: #4f46e5;
    box-shadow: none;
    background: #0b0f19;
    color: #fff;
}

/* FILE INPUT STYLE */
input[type="file"] {
    padding: 10px;
    background: #0b0f19;
    border: 1px solid #374151;
    color: #9ca3af;
}

/* BUTTON */
.btn-primary {
    background: #4f46e5;
    border: none;
    padding: 10px;
    font-weight: 600;
}

.btn-primary:hover {
    background: #4338ca;
}

/* FORM GRID */
.grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
}

@media (min-width: 768px) {
    .grid-2 {
        grid-template-columns: 1fr 1fr;
    }
}

/* FOOT NOTE */
.note {
    font-size: 13px;
    color: #9ca3af;
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="ad-card">

        <h2>Create Advertisement 🚀</h2>
        <p class="subtext">Launch your campaign in seconds</p>

        <form method="POST" enctype="multipart/form-data">

            <div class="grid">

                <!-- TITLE -->
                <div>
                    <label class="form-label">Ad Title</label>
                    <input name="title" type="text" class="form-control" placeholder="e.g. Buy Smart Gadgets Today" required>
                </div>

                <!-- LINK -->
                <div>
                    <label class="form-label">Destination Link</label>
                    <input name="link" type="text" class="form-control" placeholder="https://yourwebsite.com" required>
                </div>

                <!-- IMAGE -->
                <div>
                    <label class="form-label">Ad Image</label>
                    <input type="file" name="image" class="form-control" required>
                </div>

            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4">
                Launch Ad 🚀
            </button>

        </form>

        <div class="note">
            Tip: Use high-quality images (1080x1080 recommended) for better performance.
        </div>

    </div>

</div>

</body>
</html>
